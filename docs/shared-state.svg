<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title description">
  <title id="title">Separate PR-state reads and a shared cache</title>
  <desc id="description">On the left, three readers independently make three HTTP reads to the GitHub API. On the right, the same readers share a local GitHub CLI cache, which needs one HTTP refresh per page and cache window. Ordinary observations are cached for 30 seconds; wait observations use 5 seconds. The static diagram remains complete when reduced motion is preferred.</desc>
  <defs>
    <linearGradient id="cache-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C65B4"/>
      <stop offset="1" stop-color="#07477F"/>
    </linearGradient>
    <marker id="coral-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 7 3.5 0 7Z" fill="#FF5F53"/>
    </marker>
    <marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 7 3.5 0 7Z" fill="#0F7DDE"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .heading { font-size: 21px; font-weight: 700; fill: #172C45; }
    .reader { fill: #FFFFFF; stroke: #D5E1EF; stroke-width: 1.4; }
    .label { font-size: 16px; font-weight: 600; fill: #29415C; text-anchor: middle; }
    .api { font-size: 16px; font-weight: 650; fill: #FFFFFF; text-anchor: middle; }
    .caption { font-size: 17px; font-weight: 650; }
    .packet { opacity: 0; animation: move 5.4s linear infinite; }
    @keyframes move {
      0%, 10% { transform: translateX(0); opacity: 0; }
      15% { opacity: 1; }
      46% { transform: translateX(var(--travel)); opacity: 1; }
      50%, 100% { transform: translateX(var(--travel)); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .packet { animation: none !important; display: none; }
    }
  </style>

  <rect width="960" height="340" rx="22" fill="#F7FAFF"/>
  <rect x="12" y="12" width="458" height="316" rx="19" fill="#FFFFFF" stroke="#D8E3F0"/>
  <rect x="490" y="12" width="458" height="316" rx="19" fill="#F0F7FF" stroke="#BFD7F0"/>
  <text x="34" y="47" class="heading">Separate reads</text>
  <text x="512" y="47" class="heading">Shared cache</text>

  <g>
    <rect x="34" y="78" width="120" height="44" rx="11" class="reader"/>
    <rect x="34" y="142" width="120" height="44" rx="11" class="reader"/>
    <rect x="34" y="206" width="120" height="44" rx="11" class="reader"/>
    <text x="94" y="106" class="label">Reader 1</text>
    <text x="94" y="170" class="label">Reader 2</text>
    <text x="94" y="234" class="label">Reader 3</text>
  </g>
  <g fill="none" stroke="#FF5F53" stroke-width="1.8" marker-end="url(#coral-arrow)">
    <path d="M168 100H314"/>
    <path d="M168 164H314"/>
    <path d="M168 228H314"/>
  </g>
  <g fill="#FF5F53">
    <circle cx="174" cy="100" r="3.5" class="packet" style="--travel: 130px"/>
    <circle cx="174" cy="164" r="3.5" class="packet" style="--travel: 130px; animation-delay: -1.8s"/>
    <circle cx="174" cy="228" r="3.5" class="packet" style="--travel: 130px; animation-delay: -3.6s"/>
  </g>
  <rect x="328" y="78" width="118" height="172" rx="16" fill="#142D4B"/>
  <text x="387" y="158" class="api">GitHub</text>
  <text x="387" y="182" class="api">API</text>
  <text x="34" y="294" class="caption" fill="#AA3128">3 HTTP reads</text>

  <g>
    <rect x="512" y="78" width="120" height="44" rx="11" class="reader"/>
    <rect x="512" y="142" width="120" height="44" rx="11" class="reader"/>
    <rect x="512" y="206" width="120" height="44" rx="11" class="reader"/>
    <text x="572" y="106" class="label">Reader 1</text>
    <text x="572" y="170" class="label">Reader 2</text>
    <text x="572" y="234" class="label">Reader 3</text>
  </g>
  <g fill="none" stroke="#0F7DDE" stroke-width="1.8">
    <path d="M632 100H650M632 164H674M632 228H650M650 100V228"/>
  </g>
  <g fill="#0F7DDE">
    <circle cx="650" cy="100" r="2.5"/>
    <circle cx="650" cy="164" r="2.5"/>
    <circle cx="650" cy="228" r="2.5"/>
    <circle cx="648" cy="100" r="3" class="packet" style="--travel: -13px; animation-delay: -2.5s"/>
    <circle cx="648" cy="164" r="3" class="packet" style="--travel: -13px; animation-delay: -3.1s"/>
    <circle cx="648" cy="228" r="3" class="packet" style="--travel: -13px; animation-delay: -3.7s"/>
  </g>
  <rect x="674" y="120" width="136" height="88" rx="15" fill="url(#cache-fill)" stroke="#0F7DDE" stroke-width="1.5"/>
  <text x="742" y="154" class="api">gh cache</text>
  <text x="742" y="180" text-anchor="middle" font-size="12" font-weight="550" fill="#E3F0FF">30s · wait 5s</text>
  <path d="M820 164H848" fill="none" stroke="#0F7DDE" stroke-width="1.8" marker-end="url(#blue-arrow)"/>
  <circle cx="821" cy="164" r="3.5" fill="#0F7DDE" class="packet" style="--travel: 20px"/>
  <rect x="862" y="128" width="66" height="72" rx="13" fill="#142D4B"/>
  <text x="895" y="159" text-anchor="middle" font-size="14" font-weight="650" fill="#FFFFFF">GitHub</text>
  <text x="895" y="181" text-anchor="middle" font-size="14" font-weight="650" fill="#FFFFFF">API</text>
  <text x="512" y="294" class="caption" fill="#0A5D9F">1 HTTP refresh / page</text>
</svg>
